  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA redirect handler (works with 404.html) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.tsx"></script>
      <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/gridrival-showcase/sw.js").catch(function(){})})}</script>
  </body>
</html>
